name: Publish

# Tag pushes and manual dispatch. The publish job waits on the npm-publish
# environment, which must require a reviewer.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  publish:
    name: publish
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Tag matches package version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi

      - run: npm ci

      # Publishing is OIDC only. npm >= 11.5.1 is required. Do not set a
      # registry token; a dummy NODE_AUTH_TOKEN makes the CLI skip OIDC.
      - name: Install npm CLI
        run: npm install -g npm@11.21.0

      # npm reads bin paths before prepack. Build first so dist/cli/*.js
      # is present for that check. dist/ stays gitignored.
      - name: Build
        run: npm run build

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          published="$(npm view "${name}@${version}" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "${name}@${version} is already on npm"
            exit 0
          fi
          npm publish --provenance --access public
