name: Publish

# Manual only. A dispatch does not publish by itself: the publish job waits
# on the npm-publish environment, which must require a reviewer.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  publish:
    name: publish
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Publishing is OIDC only. npm >= 11.5.1 is required. Do not set a
      # registry token; a dummy NODE_AUTH_TOKEN makes the CLI skip OIDC.
      - name: Install npm CLI
        run: npm install -g npm@11.21.0

      # npm reads bin paths before prepack. Build first so dist/cli/*.js
      # is present for that check. dist/ stays gitignored.
      - name: Build
        run: npm run build

      - name: Publish
        run: |
          unset NODE_AUTH_TOKEN
          npm publish --provenance --access public
